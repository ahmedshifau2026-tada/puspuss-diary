.entries(attrs).map(([k,v])=>` ${k}="${esc(v)}"`).join('');return `<${tag}${a}>${content}</${tag}>`};const button=(label,act,cl='')=>`<button class="btn ${cl}" data-act="${act}">${label}</button>`;function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let e=estimates(),t=iso(new Date());if(tab==='today'){let since=last()?diff(t,last()):-1,day=since>=0?since+1:null,len=cycleLen(),progress=day?Math.max(0,Math.min(100,Math.round(day/len*100))):0,until=e?diff(e.next,t):null;$('app').innerHTML=`<section class="card"><p class="muted">${fmt(t)}</p><h2>Hello, ${esc(data.name)} ♡</h2><p class="muted">A gentle space to check in with yourself.</p><div class="cycle-hero"><div class="eyebrow">Next estimated period</div><div class="hero-date">${e?fmt(e.next):'Record your period'}</div><div class="muted">${until===null?'Add a period to see estimates':until>0?'Approximately '+until+' days away':until===0?'Estimated for today':'Estimate passed · update your period log when ready'}</div></div><div class="cycle-row" style="margin-top:23px"><strong>Cycle day ${day||'—'}</strong><span>Typical cycle · ${len} days</span></div><div class="cycle-track" role="progressbar" aria-label="Estimated cycle progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><div class="cycle-fill" style="width:${progress}%"></div></div><p class="muted" style="font-size:12px">Cycle progress is an estimate, not a measure of fertility.</p><div class="actions today-actions">${button('Log today','todaylog','primary')}${button('Record a period','period')}</div></section><section class="card"><h3>Today's check-in</h3>${entrySummary(t)}${e?`<div class="prediction-panel"><div class="prediction-item"><span class="eyebrow">Fertile window estimate</span><strong>${fmt(e.fertStart)} – ${fmt(e.fertEnd)}</strong></div><div class="prediction-item"><span class="eyebrow">Ovulation estimate</span><strong>${fmt(e.ov)}</strong></div></div><p class=" n><option value="unprotected" ${entry.protection==='unprotected'?'selected':''}>Unprotected sex</option></select></div></div><p class="muted">Protection details are personal records only. Cycle predictions cannot reliably determine pregnancy risk.</p><label>Private notes</label><textarea id="notes" placeholder="Anything you would like to remember…">${esc(entry.notes||'')}</textarea><div class="actions">${button('Save check-in','savelog','primary')}${button('Delete check-in','deletelog','danger')}${button('Record / edit period','period')}</div><p class="muted">Discharge observations are personal notes, not medical interpretations.</p></section>`}

else if(tab==='settings'){$('app').innerHTML=`<section class="card"><h2>Settings</h2><label>Display name</label><input id="name" value="${esc(data.name)}"><div class="formgrid"><div><label>Typical cycle length (days)</label><input id="cycle" type="number" min="15" max="90" value="${data.cycle}"></div><div><label>Typical period length (days)</label><input id="length" type="number" min="1" max="15" value="${data.length}"></div></div><div class="actions">${button('Save settings','savesettings','primary')}</div></section><section class="card"><h3>Private backups</h3><p>Everything is saved in this browser on this device. Clearing browser data or changing devices can erase it. Export backups regularly.</p><div class="actions">${button('Export backup (.json)','export','primary')}<label class="btn" style="margin:0">Import backup<input id="import" type="file" accept="application/json,.json" style="display:none"></label>${button('Delete all local data','wipe','danger')}</div><p class="note">A backup contains sensitive personal health information. Keep it in a private location. Import replaces current app data.</p></section>`}}
function entrySummary(d){let x=data.entries[d];if(!x)return '<p class="muted">No check-in saved for this date.</p>';return `<p>${x.mood?'Mood: '+esc(x.mood)+' · ':''}${x.flow&&x.flow!=='None'?'Flow: '+esc(x.flow)+' · ':''}${x.energy&&x.energy!=='Not recorded'?'Energy: '+esc(x.energy):''}</p>${x.symptoms?.length?`<p>Symptoms: ${x.symptoms.map(esc).join(', ')}</p>`:''}${x.sleep?`<p>Sleep: ${esc(x.sleep)} hours</p>`:''}${x.discharge&&x.discharge!=='Not recorded'?`<p>Discharge: ${esc(x.discharge)}</p>`:''}${x.sex==='yes'?`<p>Intimacy: Had sex${x.protection==='protected'?' · Protection used':x.protection==='unprotected'?' · Unprotected':''}</p>`:x.sex==='no'?'<p>Intimacy: Did not have sex</p>':''}${x.notes?`<p>${esc(x.notes)}</p>`:''}`}
function periodDialog(start){let existing=data.periods.find(p=>p.start===start),a=prompt('Period START date (YYYY-MM-DD):',existing?.start||selected);if(a===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||Number.isNaN(parse(a).getTime()))return alert('Enter a valid YYYY-MM-DD date.');let b=prompt('Period END date (YYYY-MM-DD):',existing?.end||add(a,Number(data.length)-1));if(b===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(b)||Number.isNaN(parse(b).getTime())||diff(b,a)<0||diff(b,a)>20)return alert('End date must be within 21 days of start.');if(data.periods.some(p=>p!==existing&&a<=p.end&&b>=p.start))return alert('This overlaps an existing period.');if(existing){existing.start=a;existing.end=b}else data.periods.push({start:a,end:b});data.periods.sort((p,q)=>p.start.localeCompare(q.start));save();render()}
document.addEventListener('click',ev=>{let n=ev.target.closest('[data-tab],[data-date],[data-act],[data-mood],[data-symptom],[data-period]');if(!n)return;if(n.dataset.tab){tab=n.dataset.tab;render();return}if(n.dataset.date){selected=n.dataset.date;render();return}if(n.dataset.period){periodDialog(n.dataset.period);return}if(n.dataset.mood){chosenMoods=chosenMoods.includes(n.dataset.mood)?[]:[n.dataset.mood];document.querySelectorAll('[data-mood]').forEach(b=>b.classList.toggle('on',chosenMoods.includes(b.dataset.mood)));return}if(n.dataset.symptom){let s=n.dataset.symptom;chosenSymptoms=chosenSymptoms.includes(s)?chosenSymptoms.filter(x=>x!==s):[...chosenSymptoms,s];n.classList.toggle('on');return}let act=n.dataset.act;if(act==='todaylog'){selected=iso(new Date());tab='log'}if(act==='editday')tab='log';if(act==='prev'||act==='next'){let [y,m]=month.split('-').map(Number);month=iso(new Date(y,m-1+(act==='prev'?-1:1),1,12)).slice(0,7)}if(act==='period')return periodDialog();if(act==='savelog'){let sleep=$('sleep').value;if(sleep!==''&&(+sleep<0||+sleep>24))return alert('Sleep must be 0–24 hours.');data.entries[selected]={mood:chosenMoods[0]||'',symptoms:chosenSymptoms,flow:$('flow').value,energy:$('energy').value,sleep:sleep===''?'':Number(sleep),discharge:$('discharge').value,sex:$('sex').value,protection:$('sex').value==='yes'?$('protection').value:'',notes:$('notes').value.slice(0,5000)};save();tab='today'}if(act==='deletelog'){if(confirm('Delete the check-in for '+fmt(selected)+'?')){delete data.entries[selected];save()}else return}if(act==='savesettings'){let c=Number($('cycle').value),l=Number($('length').value);if(c<15||c>90||l<1||l>15)return alert('Check cycle and period lengths.');data.name=$('name').value.trim().slice(0,60)||'Hashma';data.cycle=c;data.length=l;save()}if(act==='export'){let blob=new Blob([JSON.stringify({format:'puspuss-diary-standalone',version:1,data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Puspuss-Diary-Backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(act==='wipe'){if(!confirm('Permanently delete all Puspuss Diary data stored in this browser? Export a backup first.'))return;localStorage.removeItem(KEY);location.reload();return}render()});document.addEventListener('change',async ev=>{if(ev.target.id==='sex'){let p=$('protection');p.disabled=ev.target.value!=='yes';if(p.disabled)p.value=''}if(ev.target.id==='date'){selected=ev.target.value;render()}if(ev.target.id==='import'){let f=ev.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!=='puspuss-diary-standalone'||!obj.data||!Array.isArray(obj.data.periods)||typeof obj.data.entries!=='object'||Array.isArray(obj.data.entries))throw Error('Not a valid Puspuss Diary standalone backup');if(!confirm('Replace all current app data with this backup?'))return;data=obj.data;save();render()}catch(e){alert('Import failed: '+e.message)}}});render();})();
</script></body></html>
